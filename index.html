
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRK Gaming Store | Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #090909; color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 20px; background: #151515;
      border-bottom: 1px solid #d4a72c;
      display: flex; justify-content: space-between; gap: 12px;
      align-items: center; flex-wrap: wrap;
    }
    h1, h2 { margin-top: 0; }
    h1 { color: #f5c542; font-size: 22px; }
    main { max-width: 1100px; margin: auto; padding: 20px; }
    .panel, .stat {
      background: #151515; border: 1px solid #343434;
      border-radius: 12px; padding: 18px; margin-bottom: 18px;
    }
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
      gap: 12px;
    }
    .stat strong { color: #f5c542; font-size: 28px; display: block; }
    input, textarea {
      display: block; width: 100%; margin: 10px 0; padding: 12px;
      border-radius: 8px; border: 1px solid #444;
      background: #0c0c0c; color: white;
    }
    button {
      padding: 11px 15px; border: 0; border-radius: 8px;
      background: #f5c542; color: #111; font-weight: bold;
      cursor: pointer; margin: 4px;
    }
    .secondary { background: #333; color: white; }
    .danger { background: #9d2929; color: white; }
    .game {
      border-top: 1px solid #333; padding: 14px 0;
      overflow-wrap: anywhere;
    }
    .muted { color: #aaa; }
    #app { display: none; }
    #status { white-space: pre-wrap; color: #f5c542; }
  </style>
</head>
<body>
  <header>
    <h1>KRK GAMING STORE — ADMIN</h1>
    <button id="logout" class="secondary" hidden>Logout</button>
  </header>

  <main>
    <section id="login" class="panel">
      <h2>Admin Login</h2>
      <p class="muted">Sirf authorized admin account use karein.</p>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Admin email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </section>

    <section id="app">
      <div class="stats">
        <div class="stat">Total Games<strong id="total">0</strong></div>
        <div class="stat">Published<strong id="published">0</strong></div>
        <div class="stat">Unpublished<strong id="unpublished">0</strong></div>
      </div>

      <section class="panel">
        <h2 id="formTitle">Add New Game</h2>
        <form id="gameForm">
          <input id="gameTitle" placeholder="Game title" required>
          <textarea id="description" placeholder="Game description" required></textarea>
          <input id="imageUrl" type="url" placeholder="Game image URL (https://...)">
          <input id="downloadUrl" type="url" placeholder="Official download URL (https://...)" required>
          <label><input id="isPublished" type="checkbox" checked style="display:inline;width:auto"> Published on Store</label>
          <button type="submit">Save Game</button>
          <button type="button" id="cancelEdit" class="secondary" hidden>Cancel Edit</button>
        </form>
      </section>

      <section class="panel">
        <h2>Games Management</h2>
        <div id="gamesList">Loading games...</div>
      </section>
    </section>
    <p id="status" role="status"></p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import {
      getFirestore, collection, getDocs, addDoc, doc, updateDoc,
      deleteDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // Apne KRK Gaming Store project ka existing config yahan rakhein.
    const firebaseConfig = {
      const firebaseConfig = {
  apiKey: "AIzaSyAUiRePiSDzXC50hUEad3eZ6NprPS364YE",
  authDomain: "krk-gaming-store.firebaseapp.com",
  projectId: "krk-gaming-store",
      storageBucket: "krk-gaming-store.firebasestorage.app",
      messagingSenderId: "906609596294",
      appId: "1:906609596294:web:51f5dab4aaeb33ea7fbe07",
      measurementId: "G-KZ8G7GKPJ4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);

    let editingId = null;
    let gamesCache = [];

    function status(message) { $("status").textContent = message; }

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      try {
        await signInWithEmailAndPassword(
          auth, $("email").value.trim(), $("password").value
        );
      } catch (error) {
        status("Login nahi hua: " + error.message);
      }
    });

    onAuthStateChanged(auth, async user => {
      $("login").style.display = user ? "none" : "block";
      $("logout").hidden = !user;
      $("app").style.display = "none";
      if (!user) return;

      try {
        const token = await user.getIdTokenResult(true);
        if (token.claims.admin !== true) {
          status("Access denied: is account par admin permission nahi hai.");
          await signOut(auth);
          return;
        }
        $("app").style.display = "block";
        status("Admin login successful.");
        await loadGames();
      } catch (error) {
        status("Dashboard load nahi hua: " + error.message);
      }
    });

    $("logout").addEventListener("click", () => signOut(auth));

    async function loadGames() {
      const snapshot = await getDocs(collection(db, "games"));
      gamesCache = snapshot.docs.map(item => ({
        id: item.id, ...item.data()
      }));
      $("total").textContent = gamesCache.length;
      $("published").textContent =
        gamesCache.filter(game => game.published === true).length;
      $("unpublished").textContent =
        gamesCache.filter(game => game.published !== true).length;

      const list = $("gamesList");
      list.replaceChildren();

      if (!gamesCache.length) {
        list.textContent = "Abhi koi game nahi hai.";
        return;
      }

      gamesCache.forEach(game => {
        const row = document.createElement("div");
        row.className = "game";
        const title = document.createElement("h3");
        title.textContent = game.title || "Untitled game";
        const desc = document.createElement("p");
        desc.textContent = game.description || "";
        const state = document.createElement("p");
        state.className = "muted";
        state.textContent = game.published ? "Published" : "Unpublished";
        const edit = document.createElement("button");
        edit.textContent = "Edit";
        edit.addEventListener("click", () => editGame(game.id));
        const remove = document.createElement("button");
        remove.textContent = "Delete";
        remove.className = "danger";
        remove.addEventListener("click", () => removeGame(game.id));
        row.append(title, desc, state, edit, remove);
        list.append(row);
      });
    }

    $("gameForm").addEventListener("submit", async event => {
      event.preventDefault();
      const user = auth.currentUser;
      if (!user) return status("Pehle login karein.");

      const game = {
        title: $("gameTitle").value.trim(),
        description: $("description").value.trim(),
        imageUrl: $("imageUrl").value.trim(),
        downloadUrl: $("downloadUrl").value.trim(),
        published: $("isPublished").checked,
        updatedAt: serverTimestamp()
      };

      try {
        if (editingId) {
          await updateDoc(doc(db, "games", editingId), game);
          status("Game update ho gayi.");
        } else {
          game.createdAt = serverTimestamp();
          await addDoc(collection(db, "games"), game);
          status("Game add ho gayi.");
        }
        resetForm();
        await loadGames();
      } catch (error) {
        status("Save nahi hua: " + error.message);
      }
    });

    function editGame(id) {
      const game = gamesCache.find(item => item.id === id);
      if (!game) return;
      editingId = id;
      $("gameTitle").value = game.title || "";
      $("description").value = game.description || "";
      $("imageUrl").value = game.imageUrl || "";
      $("downloadUrl").value = game.downloadUrl || "";
      $("isPublished").checked = game.published === true;
      $("formTitle").textContent = "Edit Game";
      $("cancelEdit").hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
      editingId = null;
      $("gameForm").reset();
      $("formTitle").textContent = "Add New Game";
      $("cancelEdit").hidden = true;
    }
    $("cancelEdit").addEventListener("click", resetForm);

    async function removeGame(id) {
      if (!confirm("Kya aap waqai is game ko delete karna chahte hain?")) return;
      try {
        await deleteDoc(doc(db, "games", id));
        status("Game delete ho gayi.");
        await loadGames();
      } catch (error) {
        status("Delete nahi hua: " + error.message);
      }
    }
  </script>
</body>
</html>
